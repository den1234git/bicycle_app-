name: bicycle_app
description: bicycle navigation app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.2.5
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  # ✅ 追加: AndroidSettings(forceLocationManager等)を使うため明示的に追加
  geolocator_android: ^5.0.0
  audioplayers: ^5.2.1
  sensors_plus: ^6.0.1
  shared_preferences: ^2.2.2
  http: ^1.6.0
  url_launcher: ^6.3.0
  geocoding: ^2.1.0
  flutter_polyline_points: ^2.1.0

  flutter_foreground_task: ^8.17.0
  flutter_local_notifications: ^19.2.1
  permission_handler: ^11.3.1

  path_provider: ^2.1.2
  image_picker: ^1.1.2
  model_viewer_plus: ^1.8.1

dev_dependencies:
  flutter_lints: ^4.0.0
  
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/character/
    - assets/character_model.glb
    - assets/map_style.json
    - assets/sounds/